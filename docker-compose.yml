services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-economy}
      POSTGRES_USER: ${POSTGRES_USER:-economy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  economy-api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-economy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-economy}
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
      TOKEN_PRICE: ${TOKEN_PRICE:-10}
      CHALLENGE_FEE_ENABLED: ${CHALLENGE_FEE_ENABLED:-true}
      CHALLENGE_FEE_PERCENT: ${CHALLENGE_FEE_PERCENT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
